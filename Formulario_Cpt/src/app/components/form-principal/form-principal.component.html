<div class="card p-fluid">
    <div class="card flex justify-content-center align-items-center">
        <label class="gowun-dodum-regular">Formulario de Solicitud de Vacantes</label>
    </div>
    <form [formGroup]="prinForm">
        <div class="p-field pt-3">
            <label class="gowun-dodum-regular" for="name">Nombre</label>
        </div>
        <div class="p-field pt-1">
            <label class="italic-light-gray">Descripción</label>
        </div>
        <div class="pt-1 formgrid grid">
            <div class="field col">
                <p-inputGroup>
                    <p-inputGroupAddon><i class="pi pi-user"></i></p-inputGroupAddon>
                    <input type="text" id="name" pInputText formControlName="name" placeholder="Primer Nombre">
                </p-inputGroup>
                <div *ngIf="prinForm.controls['name'].invalid && prinForm.controls['name'].touched" class="error">El Nombre es Requerido</div>
            </div>
            <div class="field col">
                <p-inputGroup>
                    <p-inputGroupAddon><i class="pi pi-user"></i></p-inputGroupAddon>
                    <input type="text" id="apelli" pInputText formControlName="apelli" placeholder="Apellido">
                </p-inputGroup>
                <div *ngIf="prinForm.controls['apelli'].invalid && prinForm.controls['apelli'].touched" class="error">El Apellido es Requerido</div>
            </div>
        </div>
        <div class="p-field pt-3">
            <label class="gowun-dodum-regular" for="email">Correo electrónico</label>
        </div>
        <div class="p-field pt-1">
            <label class="italic-light-gray">Descripción</label>
        </div>
        <div class="pt-1 formgrid grid">
            <div class="field col">
                <p-inputGroup>
                    <p-inputGroupAddon><i class="pi pi-envelope"></i></p-inputGroupAddon>
                    <input type="email" id="email" pInputText formControlName="email" placeholder="Correo Eléctronico">
                </p-inputGroup>
                <div *ngIf="prinForm.controls['email'].invalid && prinForm.controls['email'].touched" class="error">Correo No Válido</div>
            </div>
        </div>
        <div class="p-field pt-3">
            <label class="gowun-dodum-regular" for="tel">Teléfono</label>
        </div>
        <div class="p-field pt-1">
            <label class="italic-light-gray">Descripción</label>
        </div>
        <div class="pt-1 formgrid grid">
            <div class="field col">
                <p-inputGroup>
                    <p-inputGroupAddon><i class="pi pi-phone"></i></p-inputGroupAddon>
                    <input type="tel" id="tel" pInputText formControlName="tel" placeholder="Teléfono">
                </p-inputGroup>
                <div *ngIf="prinForm.controls['tel'].invalid && prinForm.controls['tel'].touched" class="error">Teléfono No Válido</div>
            </div>
        </div>
    </form>
</div>
