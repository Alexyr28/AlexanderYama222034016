<div class="filter-users-container">
    <h2>Buscar Usuario por ID</h2>
    <div class="filter-form">
        <input 
        pInputText
        type="text"
        placeholder="Ingresa el ID del usuario"
        [(ngModel)]="userId"
        />
        <button pButton 
            type="button"
            label="Buscar"
            (click)="searchUserById()"
            [disabled]="isLoading"
        ></button>
    </div>
    <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
    <p-table
        *ngIf="users.length"
        [value]="users"
        [paginator]="true"
        [rows]="5"
        [responsiveLayout]="'scroll'"
    >
        <ng-template pTemplate="header">
            <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Contraseña</th>
            <th>Acciones</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-user>
            <tr>
                <td>{{ user.userId }}</td>
                <td>{{ user.username }}</td>
                <td>{{ user.password }}</td>
                <td>
                    <button pButton type="button" label="Editar" class="p-button- sm p-button-warning"></button>
                    <button pButton type="button" label="Eliminar" class="p-button- sm p-button-danger"></button>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
